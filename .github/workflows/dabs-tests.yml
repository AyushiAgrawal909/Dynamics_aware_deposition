name: dabs tests

on:
  push:
    paths: ["dabs/**", ".github/workflows/dabs-tests.yml"]
  pull_request:
    paths: ["dabs/**", ".github/workflows/dabs-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "./dabs[test]"
      - name: Unit and reproduction tests
        working-directory: dabs
        run: python -m pytest -q
      - name: Reproduction checks
        run: dabs validate
