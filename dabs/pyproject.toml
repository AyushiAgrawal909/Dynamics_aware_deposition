[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dabs-pic"
version = "0.1.0"
description = "Dynamics-aware selection of deposition/gather filters and bandwidths for particle-in-cell simulations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "EUPL-1.2" }
authors = [
  { name = "Ayushi Agrawal" },
  { name = "Shan-Chang Lin" },
  { name = "Ezhilmathi Krishnasamy" },
  { name = "Pascal Bouvry" },
]
keywords = ["particle-in-cell", "plasma", "charge deposition", "filtering", "bandwidth selection", "dispersion relation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5", "pyyaml>=5.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dabs = "dabs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dabs = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take more than a few seconds", "data: tests that need generated snapshot data"]
