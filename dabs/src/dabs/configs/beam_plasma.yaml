# Bump-on-tail: warm electron beam (10%, drift 4.5, v_th 0.5) in a Maxwellian
# plasma (v_th = 1) with mobile ions; leapfrog time integration.  All growing
# grid modes are protected automatically.
title: beam-plasma (bump-on-tail), 1D

grid: {N: [256], L: [125.66370614359172], shape: cic}
time: {integrator: leapfrog, dt: 0.1}
species:
  - {name: core, q: -1.0, m: 1.0, n: 0.9, vth: 1.0}
  - {name: beam, q: -1.0, m: 1.0, n: 0.1, drift: 4.5, vth: 0.5}
  - {name: ions, q: 1.0, m: 1836.0, n: 1.0, T: 0.1}
auto_protect:
  min_growth_fraction: 0.2     # protect every mode growing at >= 20% of the fastest
  max_modes: 16
tolerance: 0.05
acceptance: 0.10
dispersion: {aliases: 4}
candidates:
  gaussian: {h_max: 4.0}
  binomial: {p: [0, 1, 2, 3, 4], n: [1, 2, 4, 8, 16]}
objective:
  mode: model
  metric: field
  ppc: 200
