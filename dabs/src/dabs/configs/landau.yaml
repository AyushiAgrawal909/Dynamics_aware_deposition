# Weak Landau damping, k lambda_D = 0.4: protect the damping rate of the
# forward Langmuir wave of mode (1,0) to within 5%.  The protected mode has
# k_y = 0, so nothing limits smoothing along y except h_max; the summary
# warns about it.  Protect a mode with m_y != 0 if transverse dynamics matter.
title: Landau damping, k lambda_D = 0.4

grid:
  N: [64, 16]
  L: [15.707963267948966, 8.0]   # 2 pi / 0.4
  shape: cic
time: {integrator: continuous, dt: 0.05}
species:
  - {name: electrons, q: -1.0, m: 1.0, n: 1.0, vth: 1.0}
protected_modes:
  - {mode: [1, 0], branch: least_damped, sign: 1}
tolerance: 0.05
acceptance: 0.10
dispersion: {aliases: 4}
candidates:
  gaussian: {h_max: 4.0}
  binomial: {p: [0, 1, 2, 3, 4], n: [1, 2, 4, 8, 16]}
objective:
  mode: model
  metric: density
  ppc: 1024
  signal:
    - {mode: [1, 0], amplitude: 0.01}
