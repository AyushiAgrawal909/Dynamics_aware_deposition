# Ion-acoustic wave with T_e/T_i = 10 and the real mass ratio.  The ion
# branch is picked with 'nearest' from a guess, because the Langmuir wave of
# the same mode is less damped.  Frequency is protected as well (2%).
# The quasi-neutral ion wave hardly depends on the coupling, so the width
# ends at h_max; protect the Langmuir wave too if electron dynamics matter.
title: ion-acoustic wave, T_e/T_i = 10

grid: {N: [128], L: [62.83185307179586], shape: tsc}
time: {integrator: continuous}
species:
  - {name: electrons, q: -1.0, m: 1.0, n: 1.0, T: 1.0}
  - {name: protons, q: 1.0, m: 1836.15, n: 1.0, T: 0.1}
protected_modes:
  - {mode: [2], branch: nearest, omega_guess: [0.0046, -0.0003]}
tolerance: 0.05
frequency_tolerance: 0.02
acceptance: 0.10
candidates:
  gaussian: {h_max: 4.0}
  binomial: {p: [0, 1, 2, 3], n: [1, 2, 4, 8]}
objective:
  mode: model
  metric: density
  ppc: 100
  signal:
    - {mode: [2], amplitude: 0.01}
